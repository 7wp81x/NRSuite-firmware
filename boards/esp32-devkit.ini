; Classic ESP32 DevKit
;
; Requires an external USB-to-UART bridge (CP2102 / CH340).
; The mobile flasher's classic-ESP32 stub uploader is limited to this chip
; family until separately validated for other targets.

[env:esp32-devkit]
extends           = base
board             = esp32dev
board_build.mcu   = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions/esp32dev_4mb.csv
lib_deps =
    ${base.lib_deps}
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -DCONFIG_AUTOSTART_ARDUINO=1
    -DCONFIG_ESP_WIFI_SOFTAP_SUPPORT=1
    -DCONFIG_ESP_WIFI_ENABLE_WPA2=1
    -DCONFIG_ESP_WIFI_ENABLE_SNIFFER=1
    -DENABLE_OLED=1
    -DENABLE_BLE_HID=1
    -ffunction-sections
    -fdata-sections
    -Os
    -Wl,--gc-sections
    -Wl,--allow-multiple-definition
    -DGIT_COMMIT_HASH='"dev"'
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCHIP_NAME='"ESP32"'
    -DWPS_PIXIE_SUPPORTED=1
    -Wl,--wrap=ieee80211_raw_frame_sanity_check

; Classic ESP32 standalone LD2450 serial bring-up.
; This is the normal devkit build plus LD2450 auto-start/serial debug so the
; sensor can be validated from a USB-UART serial monitor without the app.
; Do not use this profile for normal app-driven manual start.
[env:esp32-devkit-ld2450-debug]
extends = env:esp32-devkit
build_flags =
    ${env:esp32-devkit.build_flags}
    -DLD2450_BOOT_START=1
    -DLD2450_BOOT_DEBUG=1
