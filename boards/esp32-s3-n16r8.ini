; ESP32-S3 N16R8 (16 MB flash, 8 MB PSRAM).
;
; 6 MB application + ~9.9 MB FAT for USB MSC storage.

[env:esp32-s3-n16r8]
extends = esp32-s3-common
board = esp32-s3-devkitc1-n16r8
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/esp32s3_n16r8_msc.csv
