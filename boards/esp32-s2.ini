; ESP32-S2 Saola-1
;
; Native USB CDC, single-core Xtensa LX7, no BLE.

[env:esp32-s2]
extends           = base, common_flags
board             = esp32-s2-saola-1
board_build.mcu   = esp32s2
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = partitions/esp32s2_4mb_msc.csv
; S2 has no Bluetooth radio. Keep the BLE HID library out of the build
; so the toolchain does not fail looking for NimBLEDevice.h.
lib_ignore = HijelHID_BLEKeyboard
build_flags =
    ${common_flags.build_flags}
    -DCHIP_NAME='"ESP32-S2"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCONFIG_TINYUSB_ENABLED=1
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    -DCONFIG_TINYUSB_HID_ENABLED=1
    -DWPS_PIXIE_SUPPORTED=1
    -DNRSUITE_ENABLE_PORTAL=0
    -DNRSUITE_ENABLE_NRUGOCHI=0
    -Wl,--wrap=ieee80211_raw_frame_sanity_check
