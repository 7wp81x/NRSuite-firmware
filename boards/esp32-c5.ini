; ESP32-C5 family.
;
; RISC-V single core + LP core, Wi-Fi 6 dual-band, BLE 5.
; Merged images include the C5 bootloader at 0x2000 and are flashed at 0x0.
; N8R4 and N16R4 are experimental board profiles and are marked as such in
; the target registry. Do not add a C5 N16R8 profile.

[esp32-c5-common]
extends           = base, common_flags
board             = esp32-c5-devkitc1-n4
board_build.mcu   = esp32c5
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.filesystem = littlefs
board_build.partitions = partitions/esp32c5_4mb.csv
lib_deps =
    ${base.lib_deps}
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    ${common_flags.build_flags}
    -DCHIP_NAME='"ESP32-C5"'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_BLE_HID=1
    -DMSC_SUPPORTED=0
    -DWPS_PIXIE_SUPPORTED=1
    -Wl,--wrap=ieee80211_raw_frame_sanity_check

[env:esp32-c5]
extends = esp32-c5-common

; Experimental: 8 MB flash + 4 MB PSRAM.
; Keeps the C5 application partition at 3 MB and grows the LittleFS data
; partition. Requires hardware validation before promotion.
[env:esp32-c5-n8r4]
extends = esp32-c5-common
board = esp32-c5-devkitc1-n8r4
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions/esp32c5_8mb.csv

; Experimental: 16 MB flash + 4 MB PSRAM.
; Requires hardware validation before promotion.
[env:esp32-c5-n16r4]
extends = esp32-c5-common
board = esp32-c5-devkitc1-n16r4
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/esp32c5_16mb.csv

; Test-only C5 BLE HID heap diagnostic image.
; Lowers the free/largest guard just enough for the current C5 baseline
; (about 85.5 KiB free) and emits stage-by-stage "mem" events.
; Never use this profile for a release.
[env:esp32-c5-ble-heap-diag]
extends = env:esp32-c5
build_flags =
    ${env:esp32-c5.build_flags}
    -DNRSUITE_BLE_HEAP_DIAGNOSTIC=1
    -DNRSUITE_BLE_HID_MIN_FREE_HEAP_BYTES=81920
    -DNRSUITE_BLE_HID_MIN_LARGEST_BLOCK_BYTES=40960
