; Shared ESP32-S3 configuration.
;
; Native USB CDC + OTG, dual-core Xtensa LX7.
; The board-specific profile file owns flash size, PSRAM type, and the
; partition table. The universal S3 profile is the safe fallback and does
; not assume that PSRAM is present.

[esp32-s3-common]
extends           = base, common_flags
board             = esp32-s3-devkitc-1
board_build.mcu   = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.filesystem = spiffs
board_build.partitions = partitions/esp32s3_4mb_msc.csv
lib_deps =
    ${base.lib_deps}
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    ${common_flags.build_flags}
    -DCHIP_NAME='"ESP32-S3"'
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TINYUSB_ENABLED=1
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    -DCONFIG_TINYUSB_HID_ENABLED=1
    -DENABLE_BLE_HID=1
    -DWPS_PIXIE_SUPPORTED=1
    -Wl,--wrap=ieee80211_raw_frame_sanity_check
