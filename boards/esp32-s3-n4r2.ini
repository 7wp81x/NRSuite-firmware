; ESP32-S3 N4R2 (4 MB flash, 2 MB PSRAM).
;
; Primary environment for the legacy "esp32-s3-psram" profile.
; The compatibility alias lives in the same file.

[env:esp32-s3-n4r2]
extends = esp32-s3-common
board = esp32-s3-devkitc1-n4r2
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions/esp32s3_4mb_msc.csv

[env:esp32-s3-psram]
; Backwards-compatible environment alias for existing local scripts.
; Release builds should use esp32-s3-n4r2.
extends = env:esp32-s3-n4r2
