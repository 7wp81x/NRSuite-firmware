name: Firmware Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        environment: [ esp32-c5, esp32-c5-n8r4, esp32-c5-n16r4, esp32-c3, esp32-s3, esp32-s3-n4r2, esp32-s3-n4r8, esp32-s3-n8r8, esp32-s3-n16, esp32-s3-n16r8, esp32-s2, esp32-devkit ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify release channel
        id: release_channel
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          case "$TAG" in
            *-alpha*) CHANNEL=alpha; PRERELEASE=true ;;
            *-beta*)  CHANNEL=beta;  PRERELEASE=true ;;
            *-rc*)    CHANNEL=rc;    PRERELEASE=true ;;
            *)        CHANNEL=stable; PRERELEASE=false ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "ERROR: unsupported release tag: $TAG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Firmware version=$VERSION channel=$CHANNEL prerelease=$PRERELEASE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'boards/**/*.ini', 'partitions/*.csv', 'scripts/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Validate target registry and partition layouts
        run: python3 scripts/validate_targets.py

      - name: Inject release version into firmware
        env:
          RELEASE_VERSION: ${{ steps.release_channel.outputs.version }}
        run: |
          set -e
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]

          main_cpp = Path("src/main.cpp")
          text = main_cpp.read_text()
          text = re.sub(r'#define FW_VERSION .*', f'#define FW_VERSION "{version}"', text, count=1)
          main_cpp.write_text(text)

          platformio = Path("platformio.ini")
          text = platformio.read_text()
          text = text.replace(
              '-DGIT_COMMIT_HASH=\'"dev"\'',
              f'-DGIT_COMMIT_HASH=\'"{version}"\''
          )
          platformio.write_text(text)
          PY
          grep -nE 'FW_VERSION|GIT_COMMIT_HASH' src/main.cpp platformio.ini

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Verify merged image offsets
        run: python3 scripts/verify_merged_images.py --environment ${{ matrix.environment }} --version ${{ steps.release_channel.outputs.version }}

      - name: Rename binaries with version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ steps.release_channel.outputs.channel }}
        run: |
          set -e
          TAG="$RELEASE_TAG"
          case "$RELEASE_CHANNEL" in
            alpha|beta) SRC_DIR=beta-release ;;
            rc)         SRC_DIR=rc-release ;;
            stable)     SRC_DIR=release ;;
            *) echo "Unknown release channel: $RELEASE_CHANNEL"; exit 1 ;;
          esac
          [ -d "$SRC_DIR" ] || { echo "Missing source directory: $SRC_DIR"; exit 1; }

          mkdir -p dist
          found=0
          for f in "$SRC_DIR"/*.bin; do
            [ -f "$f" ] || continue
            found=1
            cp "$f" "dist/$(basename "$f" .bin)-${TAG}.bin"
          done
          [ "$found" -eq 1 ] || { echo "No .bin files found in $SRC_DIR"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}-${{ github.ref_name }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Classify release channel
        id: release_channel
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          case "$TAG" in
            *-alpha*) CHANNEL=alpha; PRERELEASE=true ;;
            *-beta*)  CHANNEL=beta;  PRERELEASE=true ;;
            *-rc*)    CHANNEL=rc;    PRERELEASE=true ;;
            *)        CHANNEL=stable; PRERELEASE=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          set -e
          cd dist
          sha256sum *.bin > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/checksums.txt
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release_channel.outputs.prerelease == 'true' }}
          body: |
            ## NRSuite Firmware ${{ github.ref_name }}

            Release channel: `${{ steps.release_channel.outputs.channel }}`

            ### Binaries

            Flash the merged binary for your board using the NRSuite Android app flasher or esptool:

            ```bash
            esptool.py --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 <binary>.bin
            ```

            | Board | Environment | Binary pattern |
            |---|---|---|
            | ESP32-C5 DevKitC-1 (4 MB) | `esp32-c5` | `nrsuite-esp32c5-*.bin` |
            | ESP32-C5 N8R4 (experimental) | `esp32-c5-n8r4` | `nrsuite-esp32c5-n8r4-*.bin` |
            | ESP32-C5 N16R4 (experimental) | `esp32-c5-n16r4` | `nrsuite-esp32c5-n16r4-*.bin` |
            | ESP32-C3 DevKitM-1 | `esp32-c3` | `nrsuite-esp32c3-*.bin` |
            | ESP32-S3 universal safe fallback | `esp32-s3` | `nrsuite-esp32s3-*.bin` |
            | ESP32-S3 N4R2 | `esp32-s3-n4r2` | `nrsuite-esp32s3-n4r2-*.bin` |
            | ESP32-S3 N4R8 | `esp32-s3-n4r8` | `nrsuite-esp32s3-n4r8-*.bin` |
            | ESP32-S3 N8R8 | `esp32-s3-n8r8` | `nrsuite-esp32s3-n8r8-*.bin` |
            | ESP32-S3 N16 | `esp32-s3-n16` | `nrsuite-esp32s3-n16-*.bin` |
            | ESP32-S3 N16R8 | `esp32-s3-n16r8` | `nrsuite-esp32s3-n16r8-*.bin` |
            | ESP32-S2 Saola-1 | `esp32-s2` | `nrsuite-esp32s2-*.bin` |
            | ESP32 DevKit | `esp32-devkit` | `nrsuite-esp32classic-*.bin` |

            > Alpha/beta tags use a `beta-` asset prefix and RC tags use an
            > `rc-` asset prefix. Stable tags use the unprefixed `nrsuite-` name.
            > C5 merged images start at flash offset `0x0` and contain the
            > bootloader at `0x2000`. S3 release images keep app0 at `0x10000`.
            > C5 N8R4/N16R4 are experimental target profiles and require
            > hardware validation before being treated as supported.

            ### Verification

            Verify your download against `checksums.txt` before flashing:

            ```bash
            # Linux/macOS
            sha256sum -c checksums.txt

            # Windows (PowerShell)
            certutil -hashfile <binary>.bin SHA256
            ```

            ### Compatibility

            Requires NRSuite Android app `${{ github.ref_name }}`. See the
            [firmware README](https://github.com/7wp81x/NRSuite-firmware#versioning-and-compatibility)
            for the current compatibility table.

            ---
            > For authorized security testing use only. See [LEGAL.md](https://github.com/7wp81x/NRSuite-firmware/blob/main/LEGAL.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
