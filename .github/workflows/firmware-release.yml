name: Firmware Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        environment: [ esp32-c3, esp32-s3, esp32-s2, esp32-devkit ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Inject release version into firmware
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -e
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]

          main_cpp = Path("src/main.cpp")
          text = main_cpp.read_text()
          text = re.sub(r'#define FW_VERSION .*', f'#define FW_VERSION "{tag}"', text, count=1)
          main_cpp.write_text(text)

          platformio = Path("platformio.ini")
          text = platformio.read_text()
          text = text.replace(
              '-DGIT_COMMIT_HASH=\'"dev"\'',
              f'-DGIT_COMMIT_HASH=\'"{tag}"\''
          )
          platformio.write_text(text)
          PY
          grep -nE 'FW_VERSION|GIT_COMMIT_HASH' src/main.cpp platformio.ini

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Rename binaries with version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -e
          TAG="$RELEASE_TAG"
          case "$TAG" in
            *alpha*|*beta*|*rc*) SRC_DIR=beta-release ;;
            *) SRC_DIR=release ;;
          esac
          [ -d "$SRC_DIR" ] || { echo "Missing source directory: $SRC_DIR"; exit 1; }

          mkdir -p dist
          found=0
          for f in "$SRC_DIR"/*.bin; do
            [ -f "$f" ] || continue
            found=1
            cp "$f" "dist/$(basename "$f" .bin)-${TAG}.bin"
          done
          [ "$found" -eq 1 ] || { echo "No .bin files found in $SRC_DIR"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}-${{ github.ref_name }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          set -e
          cd dist
          sha256sum *.bin > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/checksums.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body: |
            ## NRSuite Firmware ${{ github.ref_name }}

            ### Binaries

            Flash the merged binary for your board using the NRSuite Android app flasher or esptool:

            ```bash
            esptool.py --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 <binary>.bin
            ```

            | Board | Environment | Binary pattern |
            |---|---|---|
            | ESP32-C3 DevKitM-1 | `esp32-c3` | `nrsuite-esp32c3-*.bin` |
            | ESP32-S3 DevKitC-1 | `esp32-s3` | `nrsuite-esp32s3-*.bin` |
            | ESP32-S2 Saola-1 | `esp32-s2` | `nrsuite-esp32s2-*.bin` |
            | ESP32 DevKit | `esp32-devkit` | `nrsuite-esp32-generic-*.bin` |

            > Alpha/beta/RC tags use the same names with a `beta-` prefix.

            ### Verification

            Verify your download against `checksums.txt` before flashing:

            ```bash
            # Linux/macOS
            sha256sum -c checksums.txt

            # Windows (PowerShell)
            certutil -hashfile <binary>.bin SHA256
            ```

            ### Compatibility

            Requires NRSuite Android app `${{ github.ref_name }}`. See the
            [firmware README](https://github.com/7wp81x/NRSuite-firmware#versioning-and-compatibility)
            for the current compatibility table.

            ---
            > For authorized security testing use only. See [LEGAL.md](https://github.com/7wp81x/NRSuite-firmware/blob/main/LEGAL.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
