name: Firmware CI

on:
  push:
    branches: [ develop, main, "release/**" ]
  pull_request:
    branches: [ develop, main, "release/**" ]

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        environment: [ esp32-c5, esp32-c5-n8r4, esp32-c5-n16r4, esp32-c3, esp32-s3, esp32-s3-n4r2, esp32-s3-n4r8, esp32-s3-n8r8, esp32-s3-n16, esp32-s3-n16r8, esp32-s2, esp32-devkit ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'boards/**/*.ini', 'partitions/*.csv', 'scripts/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Validate target registry and partition layouts
        run: python3 scripts/validate_targets.py

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Verify merged image offsets
        run: python3 scripts/verify_merged_images.py --environment ${{ matrix.environment }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            release/*.bin
            beta-release/*.bin
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Validate target registry and partition layouts
        run: python3 scripts/validate_targets.py

      - name: Run native unit tests
        run: pio test -e native
