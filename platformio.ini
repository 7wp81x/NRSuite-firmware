; NRSuite ESP32 firmware build configuration.
;
; Shared platform/toolchain configuration and external board profiles live
; here. Per-board environments are intentionally kept in boards/*.ini so
; release matrices and the target registry can stay aligned.
;
; Build all release targets:
;   pio run
;
; Build a single target:
;   pio run -e esp32-c3
;
; Flash a specific board:
;   pio run -e esp32-c3 --target upload

[platformio]
default_envs = esp32-c3
extra_configs =
    boards/*.ini
    boards/common/*.ini

; Shared platform (Bruce IDF 5.5 - required for raw 802.11 injection)
[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20260123-153546.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    adafruit/Adafruit PN532@1.3.4
extra_scripts = post:merge_script.py

[common_flags]
; PSRAM note: do NOT define -DBOARD_HAS_PSRAM=0. In the Arduino core,
; BOARD_HAS_PSRAM is treated as present when it is defined at all, so =0
; skips the core's CONFIG_SPIRAM undef path. Leave it undefined for
; non-PSRAM boards; define it only as =1 on boards with PSRAM.
build_flags =
    ; Arduino autostart (critical - without this loop() never runs)
    -DCONFIG_AUTOSTART_ARDUINO=1

    ; Raw 802.11 - required for promiscuous mode + frame injection
    -DCONFIG_ESP_WIFI_SOFTAP_SUPPORT=1
    -DCONFIG_ESP_WIFI_ENABLE_WPA2=1
    -DCONFIG_ESP_WIFI_ENABLE_SNIFFER=1
    -DENABLE_OLED=1

    ; Size optimizations
    -ffunction-sections
    -fdata-sections
    -Os
    -Wl,--gc-sections
    -Wl,--allow-multiple-definition

    ; Build identity (override for tagged releases)
    -DGIT_COMMIT_HASH='"dev"'

    ; Debug level: 0=none 1=error 2=warn 3=info 4=debug 5=verbose
    -DCORE_DEBUG_LEVEL=0
    -DLD2450_BOOT_START=0
    -DLD2450_BOOT_DEBUG=0

    ; Uncomment for LTO (smaller binary, slower build, can hide bugs)
    ; -flto
